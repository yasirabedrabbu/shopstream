server:
  port: 8080

spring:
  application:
    name: core-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopstream}
    username: ${DB_USER:shopstream}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  api-public-url: ${API_PUBLIC_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    issuer: shopstream-core-api
    access-token-ttl: 60m
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  payment:
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}
    sslcommerz:
      enabled: ${SSLCOMMERZ_ENABLED:false}
      store-id: ${SSLCOMMERZ_STORE_ID:}
      store-password: ${SSLCOMMERZ_STORE_PASSWORD:}
      sandbox: ${SSLCOMMERZ_SANDBOX:true}
  inventory:
    mode: ${INVENTORY_MODE:stub}
  mail:
    from: "${MAIL_FROM:ShopStream <no-reply@shopstream.local>}"
  marketplace:
    commission-percent: 10
    low-stock-threshold: 5
  seed:
    enabled: ${SEED_ENABLED:false}
    vendor-password: ${SEED_VENDOR_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false