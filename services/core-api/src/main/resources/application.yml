server:
  port: 8080

spring:
  application:
    name: core-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopstream}
    username: ${DB_USER:shopstream}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    issuer: shopstream-core-api
    access-token-ttl: 60m
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info