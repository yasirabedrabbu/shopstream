server:
  port: 8080

spring:
  application:
    name: core-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopstream}
    username: ${DB_USER:shopstream}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info